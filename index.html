<style>
:root{--bg:#0a0a0c;--sf:#131316;--sf2:#1a1a20;--sf3:#24242c;--glass:rgba(17,17,24,.74);--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.17);--tx:#f5f5f7;--mu:#9a9cab;--ac:#8b5cf6;--ac2:#a78bfa;--act:#c4b5fd;--acs:#1c1535;--ok:#34d399;--wn:#fbbf24;--bad:#f87171;--r:18px;color-scheme:dark;
 --font:Inter,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:600 15px/1.4 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}

#main{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;max-width:480px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:8px;min-height:0}

 .side{display:flex;flex-direction:column;gap:12px;padding:20px 0;overflow:auto;min-height:0;max-height:62dvh;align-self:start;scrollbar-width:none}}
/* header */
#top{display:flex;align-items:center;gap:8px;min-height:42px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;white-space:nowrap}

.bd:empty{display:none}.bd.ok{background:var(--ok);color:#06281c}

#hud{background:var(--glass);border:1px solid var(--ln);border-radius:var(--r);padding:8px 12px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hrow{display:flex;align-items:center;gap:12px}

/* chips */
.chip{--c:#888;--c2:#555;width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--c) 62%,#fff),var(--c) 55%,var(--c2));box-shadow:inset 0 0 0 2px #00000022,0 2px 6px #0006;position:relative;transition:.35s}

.chip.pop{animation:chipPop .7s cubic-bezier(.2,1.6,.4,1)}

#nextw .chip{width:40px;height:40px}

#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}

#shake{display:flex;align-items:center;gap:6px;background:#ffffff0e;border:1px solid var(--ln2);border-radius:999px;padding:7px 8px 7px 11px;font-size:13px;font-weight:700;transition:.15s}#shake:not(:disabled):active{transform:scale(.95)}
#shake:disabled{opacity:.35;cursor:default}
#shake b{background:var(--ac);color:#fff;border-radius:9px;min-width:20px;text-align:center;font-size:12px;padding:1px 5px}

.toast .chip{width:30px;height:30px}.toast small{display:block;color:#c9c6dc;font-weight:600;font-size:11.5px}
.toast.out{opacity:0;transform:translateY(-10px);transition:.4s}
.toast.gold{background:linear-gradient(135deg,#6b3d00,#a86b06);border-color:#fde68a77}
.toast.gold small{color:#ffe9b8}
.toast.ok{background:linear-gradient(135deg,#0c3a2a,#11604a);border-color:#34d39977}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
/* overlays */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,6,14,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:20px;z-index:5;padding:12px;animation:fin .3s}
@keyframes fin{from{opacity:0}}
.ov[hidden]{display:none}
.card{width:100%;max-width:350px;max-height:100%;overflow:auto;scrollbar-width:none;background:linear-gradient(180deg,rgba(32,26,58,.97),rgba(17,17,26,.97));border:1px solid #a78bfa40;border-radius:24px;padding:20px 18px 16px;text-align:center;box-shadow:0 24px 70px #000a;animation:cin .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes cin{from{transform:translateY(20px) scale(.94);opacity:0}}
.card h1{margin:10px 0 4px;font-size:29px;line-height:1.02;font-weight:900;letter-spacing:-.035em}
.card h1 em{font-style:normal;color:var(--ac2)}
.card p{margin:8px 0;color:#cfcde0;font-size:14px;font-weight:500;line-height:1.45}
.tag{display:inline-flex;align-items:center;gap:6px;background:#ffffff10;border:1px solid var(--ln);border-radius:999px;padding:4px 10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:700}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tag.off::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#9f78ff,#7c4dff);color:#fff;border-radius:16px;padding:13px 22px;font-weight:800;font-size:17px;box-shadow:0 5px 0 #4c1d95,0 12px 26px #4c1d9566;transition:.1s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4c1d95}
.btn.ghost{background:#ffffff10;color:var(--tx);box-shadow:none;border:1px solid var(--ln2);font-size:14px;padding:10px 14px;width:auto;flex:1}
.btn.ghost:active{transform:scale(.97)}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px}
.rwrow{display:flex;justify-content:center;gap:4px;margin:14px 0 14px}
.rwrow div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--mu);font-weight:700;width:52px;font-variant-numeric:tabular-nums}

.rwrow div.got{color:var(--ok)}
.big{font-size:48px;font-weight:900;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:8px}
.won{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.won span{display:inline-flex;align-items:center;gap:6px;background:#fbbf2420;color:#fde68a;border:1px solid #fbbf2444;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;font-weight:700}
.won .chip{width:20px;height:20px}
.hint{font-size:12.5px;color:var(--act);font-weight:700;margin:6px 0}
.runs{margin:10px 0 2px;text-align:left;font-size:13px}
.runs h4{margin:0 0 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.runs div{display:flex;gap:8px;padding:4px 8px;border-radius:9px;align-items:center;font-variant-numeric:tabular-nums}
.runs div.me{background:#8b5cf62a;color:var(--act)}
.runs span:first-child{width:16px;color:var(--mu)}.runs span:nth-child(2){flex:1;color:#cfcde0;font-weight:600}
.menu{display:grid;gap:8px;margin-top:14px}
.menu .btn.ghost{width:100%;justify-content:space-between;padding:12px 14px}
.menu .btn.ghost b{color:var(--act);font-weight:700}
.fine{color:var(--mu);font-size:11.5px;font-weight:500;margin:12px 0 0;line-height:1.4}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,5,12,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fin .2s}
#modal[hidden]{display:none}
#sheet{width:100%;max-width:560px;max-height:90dvh;background:linear-gradient(180deg,#1b1630,#111118);border:1px solid #a78bfa33;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:sup .35s cubic-bezier(.2,1,.3,1);overflow:hidden}

#sheet .body{overflow:auto;padding:4px 18px 22px;-webkit-user-select:text;user-select:text}
.panel{background:var(--glass);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:10px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel h3{margin:0 0 8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mu);font-weight:700}

.rw{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}

.ms{padding:9px 0;border-top:1px solid var(--ln)}

.ms i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .3s}
.ms.done div span{color:var(--ok)}.ms.done i{background:var(--ok)}.ms.done b{color:var(--ok)}
.mrw{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px;border-radius:12px;background:#06b6d414;border:1px dashed #06b6d455;font-size:12.5px;color:#cfeff6}

function tone(f,d,type,vol,slide,delay){if(muted||!AC)return;const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.15,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(FX);o.start(t0);o.stop(t0+d+.05)}
let NB=null;function noiseBuf(){if(!NB){const n=AC.sampleRate*1;NB=AC.createBuffer(1,n,AC.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1}return NB}
function noise(d,vol,fc,type,dest,t0){if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf();const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fc||800;const g=AC.createGain();const t=t0||AC.currentTime;g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(dest||FX);s.start(t,Math.random()*.5);s.stop(t+d+.02)}

    const dx=b.x-a.x,dy=b.y-a.y,mn=a.r+b.r;

 street:['Fill the whole street, in order',()=>ensurePlay(()=>{markCheat();S.balls=[];S.dangerT=0;
  for(let t=1;t<=9;t++)setTimeout(()=>{if(S.state!=='play')return;unlock(t,rnd(L+60,R-60),rnd(250,420),t<9)},t*170);
  setTimeout(()=>{if(S.state!=='play')return;[2,3,4,5,6,7].forEach((t,i)=>{const b=newBall(t,L+40+i*58,FLOOR-140-i*10);S.balls.push(b)});
   const a=newBall(9,W/2-110,DROPY+30),b=newBall(9,W/2+110,DROPY+30);a.vx=320;b.vx=-320;a.age=b.age=0;S.balls.push(a,b)},1750)})],
 lose:['Watch the window overflow: a real game over',()=>ensurePlay(()=>{markCheat();S.cur=null;const seq=[8,6,7,5,8,7,6,5,8,6,7,5,8,7];kimSay(tr('kimLose'));
  seq.forEach((t,i)=>setTimeout(()=>{if(S.state!=='play')return;const b=newBall(t,L+50+((i*97)%(R-L-100)),DROPY);b.vy=140;b.age=0;b.nm=true;S.balls.push(b);SFX.drop()},i*170));
  setTimeout(()=>{if(S.state==='play'){S.dangerT=OVER_T;gameOver()}},7000)})],
 party:['Street party: lights and fireworks',()=>{S.partyT=8;street.update();banner(tr('party'));SFX.win();burst(W/2,260,'#fde68a',120,1.5);S.shakeT=.4;kimJoy=Date.now()+8000;kimLvl=-1;paintKim();setTimeout(()=>{kimLvl=-1;paintKim()},8100)}],
 rain:['Twelve keys fall from the sky',()=>ensurePlay(()=>{markCheat();for(let i=0;i<12;i++)setTimeout(()=>{const b=newBall(0,rnd(L+20,R-20),80);b.age=0;b.vy=200;S.balls.push(b)},i*90)})],
 rich:['+1,000 points',()=>ensurePlay(()=>{markCheat();float(W/2,300,'+1,000','#fde68a',30);addScore(1000)})],
 big:['Your next drop is a Gym',()=>ensurePlay(()=>{markCheat();if(S.cur){S.cur.t=7;S.cur.sc=0}else S.nextT=7;ui.next()})],
 shake:['Refill Shake to 3',()=>ensurePlay(()=>{markCheat();S.shakes=3;ui.shakes()})],
 slowmo:['Slow motion on / off',()=>{S.ts=S.ts===1?.35:1;toast('',`<b>${S.ts<1?'Slow motion':'Normal speed'}</b>`,1500)}],
 moon:['Low gravity on / off',()=>{grav=grav===G?G*.33:G;toast('',`<b>${grav<G?'Moon gravity':'Earth gravity'}</b>`,1500)}],
 kim:['Mr. Kim says hi',()=>{kimJoy=Date.now()+4000;kimLvl=-1;paintKim();kimSay(tr('kimFun')[Math.floor(Math.random()*5)]);setTimeout(()=>{kimLvl=-1;paintKim()},4100)}],
 reset:['Wipe coupons, missions, streak, best and board (for demos)',()=>{['coupons','runs','best','streak','lastId'].forEach(k=>ls.del(k));board.reset();ui.board();missions.reset();S.best=0;S.won=[];ui.reset();if(S.state==='title')ui.title();toast('','<b>Fresh start</b><small>Coupons, missions, best and board cleared</small>',2200)}]};
function runCode(c){c=String(c||'').trim().toLowerCase().replace(/[^a-z]/g,'');const f=CODES[c];if(!f){toast('',`<b>${esc(tr('unknown'))}</b>`,1400);return false}
 ui.closeModal();if(S.paused)setPause(false);resumeAudio();SFX.coupon();f[1]();return true}
function openCodes(){openModal('🔑 '+esc(tr('codes')),b=>{
 b.innerHTML=`<div class="codes"><input id="codeIn" placeholder="${esc(tr('codeHint'))}" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="cgrid">${Object.entries(CODES).map(([k,v])=>`<button data-c="${k}"><b>${k.toUpperCase()}</b>${esc(v[0])}</button>`).join('')}</div><p class="fine">↑↑↓↓←→←→ B A · \` or / · 5× tap the logo</p></div>`;
 const i=b.querySelector('#codeIn');setTimeout(()=>i.focus(),50);i.onkeydown=e=>{if(e.key==='Enter')runCode(i.value);if(e.key==='Escape')ui.closeModal()};
 b.querySelector('.cgrid').onclick=e=>{const x=e.target.closest('button');if(x)runCode(x.dataset.c)};
},'codes')}
let logoTaps=[];
$('#logo').addEventListener('pointerdown',()=>{const n=Date.now();logoTaps=logoTaps.filter(t=>n-t<2000);logoTaps.push(n);if(logoTaps.length>=5){logoTaps=[];openCodes()}});
let kimTaps=0,kimTT=0;
$('#kim').addEventListener('pointerdown',()=>{kimTaps++;clearTimeout(kimTT);kimTT=setTimeout(()=>kimTaps=0,500);if(kimTaps>=2){kimTaps=0;CODES.kim[1]()}});

/* ================= leaderboard UI ================= */
function lbRow(e,r,me){return `<div class="${me?'me':''}"><span class="rk">${r<4?['🥇','🥈','🥉'][r-1]:r}</span>${chipHTML(e.t,TIERS[e.t].s?'sp':'')}<span class="nm">${esc(e.n)}${e.reg?'<i>🏠</i>':''}</span><span class="sc">${fmt(e.s)}</span></div>`}
function lbHTML(l,top,meId){const mr=meId?board.rankOf(l,meId):0;let h=l.slice(0,top).map((e,i)=>lbRow(e,i+1,e.id===meId)).join('');
 if(mr>top)h+=`<div class="gap">···</div>`+lbRow(l[mr-1],mr,true);return `<div class="lb">${h}</div>`}
function openBoard(tab){tab=tab||'week';openModal('🏆 '+esc(tr('board')),b=>{
 const l=board.list(tab==='week'),me=ls.get('lastId','');
 b.innerHTML=`<div class="lbt"><button data-t="week" class="${tab==='week'?'on':''}">${esc(tr('week'))}</button><button data-t="all" class="${tab==='all'?'on':''}">${esc(tr('allTime'))}</button></div>
 <p class="fine" style="margin:0 0 8px">${esc(tr('lbHere',WID)+' · '+hood())}</p>${lbHTML(l,10,me)}<p class="fine">${esc(tr('lbNote'))}</p>`;
 b.querySelector('.lbt').onclick=e=>{const x=e.target.closest('button');if(x&&x.dataset.t!==tab){SFX.click();openBoard(x.dataset.t)}};
},'board')}
function rankBlock(){
 if(S.cheated)return `<p class="rank"><small>${esc(tr('demoNoBoard'))}</small></p>`;if(!S.entry)return '';
 const l=board.list(true),r=board.rankOf(l,S.entry.id),ab=l[r-2];
 return `<p class="rank">${esc(r===1?tr('rankTop',WID):tr('rankIs',r,WID))}${ab?`<small>${esc(tr('toPass',fmt(ab.s-S.score+1),ab.n,r-1))}</small>`:''}</p><div class="lbname"><input id="lbName" maxlength="14" placeholder="${esc(tr('yourName'))}" value="${esc(cleanName(ls.get('name','')))}" autocomplete="nickname" enterkeyhint="done"></div>`}
function boardSnip(){
 const l=board.list(true),id=S.entry&&S.entry.id,r=id?board.rankOf(l,id):0,from=r?Math.max(0,Math.min(r-2,l.length-3)):0;
 const rows=l.slice(from,from+3).map((e,i)=>lbRow(e,from+i+1,e.id===id)).join('');
 return `<div class="lbx"><h4><span>${esc(tr('lbWeek',WID))}</span><button id="oBoard">${esc(tr('seeAll'))} →</button></h4>
 <div class="lb">${rows}</div></div>`}

/* ================= share ================= */
function shareScore(){
 const url=location.origin+location.pathname+'?w='+WID;const text=tr('shareT',tierName(S.maxTier),fmt(S.score));
 if(navigator.share){navigator.share({title:'Street Merge · Vitrine',text,url}).catch(()=>{});return}
 const fb=()=>toast('',`<b>${esc(text)}</b><small>${esc(url)}</small>`,4500);
 try{navigator.clipboard.writeText(text+' '+url).then(()=>toast('',`<b>${esc(tr('copied'))}</b><small>${esc(tr('copiedS'))}</small>`,2200),fb)}catch(e){fb()}
}
/* native sponsored card for the end screen */
function adCardHTML(score){
 const nr=REWARDS.find(r=>r.at>score&&!wonToday(r.m));const k=nr?nr.m:(S.ads.length?S.ads[Math.floor(Math.random()*S.ads.length)]:'cine'),M=MER[k];
 const foot=nr?tr('unlockAt',fmt(nr.at)):(wonToday(k)?tr('inWallet'):tr('nowOn'));
 return `<div class="adcard" style="--c:${M.c};--c2:${M.c2}"><div class="adh"><span><i>${esc(tr('sponsored'))}</i> ${esc(mCat(k))}</span><span>${esc(M.d)} · ${esc(tr('until',M.h))}</span></div><div class="tx"><b>${esc(mName(k))}</b><p>${esc(mOffer(k))}</p></div><small>${esc(foot)}</small><div class="q">${qrSvg(gameURL(k))}</div></div>`}

/* ================= UI ================= */
const ui={
 score(){$('#score').textContent=fmt(S.score);$('#best').textContent=fmt(S.best)},
 next(){const c=$('#nextc');c.style.setProperty('--c',TIERS[S.nextT].c);c.style.setProperty('--c2',TIERS[S.nextT].c2);c.querySelector('img').src=glyphURL[S.nextT]},
 shakes(){$('#shN').textContent=S.shakes;$('#shake').disabled=S.shakes<1||S.state!=='play'},
 reset(){ui.score();ui.chain();ui.shakes();ui.wallet();ui.goal();ui.missions();ui.rewards();ui.board();paintKim()},
 unlock(t){ui.chain(t);paintKim()},
 chain(pop){$('#chain').innerHTML=TIERS.map((T,t)=>chipHTML(t,(S.state!=='title'&&S.maxTier>=t?'':'lock')+(T.s?' sp':'')+(pop===t?' pop':''))).join('')},
 goal(){
  const g=$('#goal'),i=S.state==='title'?0:S.rIdx;let chip,txt,val,pct;
  if(i<REWARDS.length){const r=REWARDS[i],prev=i?REWARDS[i-1].at:0,sc=S.state==='title'?0:S.score;chip=mChip(r.m);txt=tr('goalC',mName(r.m));val=fmt(sc)+' / '+fmt(r.at);pct=clamp((sc-prev)/(r.at-prev),0,1)}
  else if(!S.won.includes('pass')){chip=mChip('pass');txt=tr('goalPass');val=(S.maxTier+1)+' / '+NT;pct=(S.maxTier)/(NT-1)}
  else{chip=mChip('pass');txt=tr('goalDone');val=fmt(S.score);pct=1}
  g.classList.toggle('gwon',i>=REWARDS.length);
  if(g._chip!==chip){$('#goalChip').innerHTML=chip;g._chip=chip}
  $('#goalTxt').textContent=txt;$('#goalVal').textContent=val;$('#goalBar').style.width=(pct*100).toFixed(1)+'%';
 },
 wallet(){const n=getCoupons().filter(c=>cState(c)==='active').length;$('#walBd').textContent=n||'';
  const sw=$('#sideWal');renderWallet(sw,true);wireWallet(sw,true);const wl=$('#wlist');if(wl&&!modal.hidden&&sheet.dataset.k==='wallet'){renderWallet(wl);wireWallet(wl)}},
 missions(){const n=missions.count(),b=$('#misBd');b.textContent=n+'/3';b.classList.toggle('ok',n===3);$('#sideMis').innerHTML=missions.html();const ml=$('#mlist');if(ml&&!modal.hidden&&sheet.dataset.k==='missions')ml.innerHTML=missions.html()},
 rewards(){$('#sideRw').innerHTML=rewardsHTML()},
 board(){$('#lbTitle').textContent=tr('lbWeek',WID);$('#sideLb').innerHTML=lbHTML(board.list(true),5,ls.get('lastId',''))},
 chase(live){const el=$('#chase');if(S.state!=='play'||S.attract){el.hidden=true;el._t='';return}
  const l=S.lb||[],sc=S.score;let r=1;for(const e of l)if(e.s>=sc)r++;
  if(live&&S.rank&&r<S.rank){const p=l[r-1];if(p){toast('🏆',`<b>${esc(tr('passed',p.n))}</b><small>${esc(tr('nowRank',r))}</small>`,2000);buzz(15)}}
  S.rank=r;const t=r===1?tr('chaseTop'):tr('chase',r,fmt(l[r-2].s-sc+1),esc(l[r-2].n));
  if(el._t!==t){el._t=t;el.innerHTML='🏆 '+t}el.hidden=false},
 title(){
  const ov=$('#title');ov.hidden=false;
  ov.innerHTML=`<div class="card"><span class="tag off">${esc(FROM_AD?tr('fromAd',mName(FROM_AD))+' · '+WID:winLabel())}</span><h1>${tr('titleH')}</h1><p>${esc(tr('titleP'))}</p>
  <div class="rwrow">${REWARDS.map(r=>`<div class="${wonToday(r.m)?'got':''}">${mChip(r.m,'sp')}${wonToday(r.m)?'✓':fmt(r.at)}</div>`).join('')}</div>
  ${(()=>{const l=board.list(true),t=l.filter(e=>e.s>S.best).pop();return t?`<p class="hint" style="color:#fde68a">${esc(tr('titleLb',t.n,fmt(t.s)))}</p>`:''})()}
  ${streakN()?`<p class="hint">${esc(tr('streak',streakN()))}${streakN()>=3?' · '+esc(tr('streakOn')):''}</p>`:''}
  <button class="btn" id="bPlay">${esc(tr('play'))}</button>
  <div class="row"><button class="btn ghost" id="tHow">${esc(tr('how'))}</button><button class="btn ghost" id="tLb">🏆 ${esc(tr('boardB'))}</button><button class="btn ghost misUI" id="tMis">${esc(tr('misShort'))} · ${missions.count()}/3</button></div></div>`;
  $('#bPlay').onclick=()=>{resumeAudio();SFX.click();startGame()};$('#tHow').onclick=()=>openHow();$('#tMis').onclick=openMissions;$('#tLb').onclick=()=>{SFX.click();openBoard()};
 },
 over(){
  const me=S.score,full=S.maxTier>=NT-1;
  const ov=$('#over');ov.hidden=false;
  ov.innerHTML=`<div class="card"><span class="tag ${full?'':'off'}">${esc(full?tr('lit'):tr('room'))}</span><div class="big">${fmt(me)}</div>
  <p style="margin:4px 0 0;color:var(--act);font-weight:700">${esc(S.cheated?tr('demoRun'):S.newBest?tr('newBest'):tr('bestIs',fmt(S.best)))}</p>
  ${rankBlock()}
  <div class="row" style="align-items:center;margin:10px 0 2px;gap:10px">${chipHTML(S.maxTier,TIERS[S.maxTier].s?'sp':'')}<span style="text-align:left;font-size:13px;color:var(--mu)">${esc(tr('reached'))}<br><b style="color:var(--tx);font-size:15px">${esc(tierName(S.maxTier))}</b></span></div>
  ${S.won.length?`<div class="won">${S.won.map(m=>`<span>${mChip(m)}${esc(mName(m))}</span>`).join('')}</div>`:''}
  ${adCardHTML(me)}
  <button class="btn" id="again" style="margin-top:12px">${esc(tr('again'))}</button>
  <div class="row"><button class="btn ghost" id="oShare">${esc(tr('share'))}</button><button class="btn ghost" id="oWal">${esc(tr('walletB'))}</button></div>
  ${boardSnip()}</div>`;
  $('#again').onclick=()=>{SFX.click();startGame()};$('#oBoard').onclick=()=>{SFX.click();openBoard()};
  const ni=$('#lbName');if(ni){const save=()=>{const n=cleanName(ni.value);ls.set('name',n);if(S.entry){S.entry.n=n||tr('player');board.rename(S.entry.id,S.entry.n);ui.board();ov.querySelectorAll('.lb .me .nm').forEach(x=>x.textContent=S.entry.n)}};
   ni.oninput=save;ni.onkeydown=e=>{if(e.key==='Enter')ni.blur()}}$('#oShare').onclick=shareScore;$('#oWal').onclick=()=>openWallet();
  ui.shakes();
 },
 pause(){
  const ov=$('#pause'),inGame=S.state==='play';ov.hidden=false;
  const tg=[['music','♪ '+tr('music'),SET.music],['sound',tr('sound'),!muted],['mis',tr('tMis'),SET.mis],['goal',tr('tGoal'),SET.goal],['chain',tr('tChain'),SET.chain],['rw',tr('tRw'),SET.rw,'dk'],['wal',tr('tWal'),SET.wal,'dk'],['rank','🏆 '+tr('tRank'),SET.rank],['lb',tr('tLb'),SET.lb,'dk'],['focus',tr('tFocus'),SET.focus,'wide']];
  ov.innerHTML=`<div class="card"><h1 style="font-size:24px">${esc(inGame?tr('paused'):tr('menu'))}</h1><div class="menu">
  ${inGame?`<button class="btn" id="pResume">${esc(tr('resume'))}</button><button class="btn ghost" id="pRestart"><span>${esc(tr('restart'))}</span><b>↺</b></button>`:''}
  <button class="btn ghost" id="pHow"><span>${esc(tr('how'))}</span><b>?</b></button>
  <button class="btn ghost" id="pLang"><span>${esc(tr('lang'))}</span><b>${LANG==='ko'?'한국어':'English'}</b></button></div>
  <p class="mh">${esc(tr('settings'))}</p><div class="tg">${tg.map(([k,l,on,c])=>`<button data-k="${k}" class="${on?'on':''} ${c||''}">${esc(l)}</button>`).join('')}</div>
  ${inGame?'':`<div class="menu"><button class="btn" id="pClose">${esc(tr('close'))}</button></div>`}<p class="fine">${esc(tr('demo'))}</p></div>`;
  const c=id=>ov.querySelector(id);
  if(c('#pResume'))c('#pResume').onclick=()=>setPause(false);
  if(c('#pRestart'))c('#pRestart').onclick=()=>{S.state='over';$('#pause').hidden=true;S.paused=false;S.lastStart=0;startGame()};
  if(c('#pClose'))c('#pClose').onclick=()=>{ov.hidden=true};
  c('#pHow').onclick=()=>openHow();
  c('#pLang').onclick=()=>{setLang(LANG==='ko'?'en':'ko');ui.pause()};
  ov.querySelector('.tg').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;resumeAudio();
   if(k==='sound'){ui.toggleSound()}else{SET[k]=!SET[k];saveSet()}SFX.click();ui.pause();fit()};
 },
 toggleSound(){muted=!muted;ls.set('mute',muted);if(!muted){resumeAudio();SFX.click()}},
 closeModal(){modal.hidden=true;sheet.dataset.k='';openId=null}
};
function setLang(l){LANG=l;ls.set('lang',l);document.documentElement.lang=l;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
 const lab={music:tr('music'),board:tr('board'),missions:tr('missions'),wallet:tr('wallet'),menu:tr('menu')};document.querySelectorAll('[data-a]').forEach(b=>b.setAttribute('aria-label',lab[b.dataset.a]));
 document.querySelectorAll('.hx').forEach(b=>b.setAttribute('aria-label','Hide'));
 adCache={};street.build();ui.goal();ui.missions();ui.rewards();ui.wallet();ui.board();
 if(S.state==='play'){S.lb=board.list(true);ui.chase()}
 if(!$('#title').hidden)ui.title();if(!$('#over').hidden)ui.over();
}

/* ================= boot ================= */
$('#bWal').onclick=()=>{resumeAudio();SFX.click();openWallet()};
$('#bMis').onclick=()=>{resumeAudio();SFX.click();openMissions()};
$('#bLb').onclick=()=>{resumeAudio();SFX.click();openBoard()};
$('#bMus').onclick=()=>{SET.music=!SET.music;saveSet();resumeAudio();if(!SET.music)music.stop()};
$('#bMenu').onclick=()=>{resumeAudio();SFX.click();if(S.state==='play')setPause(true);else ui.pause()};
$('#goal').onclick=()=>{resumeAudio();openHow('rw')};
$('#shake').onclick=shake;
document.querySelectorAll('.hx').forEach(b=>b.onclick=()=>{SET[b.dataset.hide]=false;saveSet();toast('',`<b>${esc(tr('hidden'))}</b>`,2200)});
addEventListener('pointerdown',()=>resumeAudio(),{once:true,capture:true});
window.__sim={startGame,update,drop,shake,S,runCode,board,gameOver};
if(QP.has('og'))document.documentElement.classList.add('og');
const fontsReady=Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]);
Promise.all([loadGlyphs(),fontsReady]).then(()=>{
 S.nextT=0;S.best=ls.get('best',0);
 applySet();setLang(LANG);fit();ui.score();ui.chain();ui.next();ui.shakes();paintKim();
 ui.title();requestAnimationFrame(loop);
 new ResizeObserver(fit).observe($('#stage'));
 setInterval(()=>{if(!document.hidden){ui.wallet();if(missions.get().d!==dayKey())ui.missions()}},30000);
});
