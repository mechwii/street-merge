<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<title>Street Merge · Vitrine</title>
<meta name="description" content="Merge shops to fill an empty shop window and light up the street. Score high to win coupons from the shops nearby.">
<meta property="og:title" content="Street Merge · Vitrine">
<meta property="og:description" content="Fill Mr. Kim's empty window. Merge shops, light up the street, win coupons.">
<meta property="og:image" content="https://mechwii.github.io/street-merge/og.png">
<meta property="og:url" content="https://mechwii.github.io/street-merge/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%238b5cf6%27/%3E%3Crect x=%277%27 y=%277%27 width=%2718%27 height=%2718%27 rx=%273%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--sf:#131316;--sf2:#1a1a20;--sf3:#24242c;--glass:rgba(17,17,24,.74);--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.17);--tx:#f5f5f7;--mu:#9a9cab;--ac:#8b5cf6;--ac2:#a78bfa;--act:#c4b5fd;--acs:#1c1535;--ok:#34d399;--wn:#fbbf24;--bad:#f87171;--r:18px;color-scheme:dark;
 --font:Inter,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:600 15px/1.4 var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#street{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);justify-content:center}
.side{display:none}
#main{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;max-width:480px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:8px;min-height:0}
@media(min-width:1040px){#app{grid-template-columns:280px minmax(0,480px) 280px;gap:28px;padding:0 24px}
 .side{display:flex;flex-direction:column;gap:12px;padding:20px 0;overflow:auto;min-height:0;max-height:62dvh;align-self:start;scrollbar-width:none}}
/* header */
#top{display:flex;align-items:center;gap:8px;min-height:42px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;background:var(--ac);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px #8b5cf655}
.logo::after{content:"";width:15px;height:15px;border:2.6px solid #fff;border-radius:4px}
.brand div{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:10.5px;color:var(--ac2);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ib{position:relative;width:40px;height:40px;border-radius:12px;background:var(--glass);border:1px solid var(--ln);display:grid;place-items:center;transition:.15s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);flex:none}
.ib:hover{background:var(--sf3)}.ib:active{transform:scale(.94)}
.ib svg{width:20px;height:20px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
.bd:empty{display:none}.bd.ok{background:var(--ok);color:#06281c}
/* hud */
#hud{background:var(--glass);border:1px solid var(--ln);border-radius:var(--r);padding:8px 12px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hrow{display:flex;align-items:center;gap:12px}
#kim{width:44px;height:44px;flex:none;border-radius:50%;overflow:hidden;border:2px solid var(--ln2)}
#kim svg{width:100%;height:100%;display:block}
.stat{display:flex;flex-direction:column;min-width:0}
.stat small,#nextw small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:700}
.stat b{font-size:26px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat.b2 b{font-size:17px;color:var(--act)}
.hrow .sp{flex:1}
#nextw{display:flex;flex-direction:column;align-items:center;gap:2px}
#goal{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 8px;width:100%;margin-top:8px;text-align:left}
#goal .chip{width:22px;height:22px;grid-row:1/3}
#goal .gl{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e4e4ee}
#goal .gv{font-size:12px;color:var(--mu);font-weight:700;font-variant-numeric:tabular-nums}
#goal em{grid-column:2/4;height:6px;border-radius:3px;background:#ffffff14;overflow:hidden;display:block}
#goal i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--ac),#e879f9);transition:width .35s}
#goal.won i{background:linear-gradient(90deg,#f59e0b,#fde68a)}
/* chips */
.chip{--c:#888;--c2:#555;width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--c) 62%,#fff),var(--c) 55%,var(--c2));box-shadow:inset 0 0 0 2px #00000022,0 2px 6px #0006;position:relative;transition:.35s}
.chip img{width:68%;height:68%;display:block}
.chip.lock{filter:grayscale(1) brightness(.45);opacity:.6}
.chip.sp::after{content:"";position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--wn);border:2px solid var(--bg)}
.chip.pop{animation:chipPop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes chipPop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
#nextw .chip{width:40px;height:40px}
#chain{display:flex;gap:5px;justify-content:space-between;padding:0 2px}
#chain .chip{width:auto;height:auto;flex:1;aspect-ratio:1;max-width:36px}
/* stage */
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#cv{display:block;border-radius:20px;touch-action:none;cursor:crosshair;box-shadow:0 24px 70px #000c,0 0 0 1px #ffffff1a,0 0 80px #8b5cf61f}
#says{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:#fff;color:#15131f;border-radius:14px;padding:6px 12px;font-weight:700;font-size:13px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:3;box-shadow:0 6px 18px #0006}
#says.on{opacity:1;transform:translate(-50%,0)}
#shake{display:flex;align-items:center;gap:6px;background:#ffffff0e;border:1px solid var(--ln2);border-radius:999px;padding:7px 8px 7px 11px;font-size:13px;font-weight:700;transition:.15s}#shake:not(:disabled):active{transform:scale(.95)}
#shake:disabled{opacity:.35;cursor:default}
#shake b{background:var(--ac);color:#fff;border-radius:9px;min-width:20px;text-align:center;font-size:12px;padding:1px 5px}
#toasts{position:absolute;left:0;right:0;top:46px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.toast{background:rgba(28,21,53,.96);border:1px solid #a78bfa55;border-radius:14px;padding:8px 12px 8px 8px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;box-shadow:0 10px 30px #0008;animation:tin .4s cubic-bezier(.2,1.4,.4,1);max-width:92%}
.toast .chip{width:30px;height:30px}.toast small{display:block;color:#c9c6dc;font-weight:600;font-size:11.5px}
.toast.out{opacity:0;transform:translateY(-10px);transition:.4s}
.toast.gold{background:linear-gradient(135deg,#6b3d00,#a86b06);border-color:#fde68a77}
.toast.gold small{color:#ffe9b8}
.toast.ok{background:linear-gradient(135deg,#0c3a2a,#11604a);border-color:#34d39977}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
/* overlays */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,6,14,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:20px;z-index:5;padding:12px;animation:fin .3s}
@keyframes fin{from{opacity:0}}
.ov[hidden]{display:none}
.card{width:100%;max-width:350px;max-height:100%;overflow:auto;scrollbar-width:none;background:linear-gradient(180deg,rgba(32,26,58,.97),rgba(17,17,26,.97));border:1px solid #a78bfa40;border-radius:24px;padding:20px 18px 16px;text-align:center;box-shadow:0 24px 70px #000a;animation:cin .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes cin{from{transform:translateY(20px) scale(.94);opacity:0}}
.card h1{margin:10px 0 4px;font-size:29px;line-height:1.02;font-weight:900;letter-spacing:-.035em}
.card h1 em{font-style:normal;color:var(--ac2)}
.card p{margin:8px 0;color:#cfcde0;font-size:14px;font-weight:500;line-height:1.45}
.tag{display:inline-flex;align-items:center;gap:6px;background:#ffffff10;border:1px solid var(--ln);border-radius:999px;padding:4px 10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:700}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tag.off::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#9f78ff,#7c4dff);color:#fff;border-radius:16px;padding:13px 22px;font-weight:800;font-size:17px;box-shadow:0 5px 0 #4c1d95,0 12px 26px #4c1d9566;transition:.1s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4c1d95}
.btn.ghost{background:#ffffff10;color:var(--tx);box-shadow:none;border:1px solid var(--ln2);font-size:14px;padding:10px 14px;width:auto;flex:1}
.btn.ghost:active{transform:scale(.97)}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px}
.rwrow{display:flex;justify-content:center;gap:4px;margin:14px 0 14px}
.rwrow div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--mu);font-weight:700;width:52px;font-variant-numeric:tabular-nums}
.rwrow .chip{width:34px;height:34px}
.rwrow div.got{color:var(--ok)}
.big{font-size:48px;font-weight:900;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:8px}
.won{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.won span{display:inline-flex;align-items:center;gap:6px;background:#fbbf2420;color:#fde68a;border:1px solid #fbbf2444;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;font-weight:700}
.won .chip{width:20px;height:20px}
.hint{font-size:12.5px;color:var(--act);font-weight:700;margin:6px 0}
.runs{margin:10px 0 2px;text-align:left;font-size:13px}
.runs h4{margin:0 0 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.runs div{display:flex;gap:8px;padding:4px 8px;border-radius:9px;align-items:center;font-variant-numeric:tabular-nums}
.runs div.me{background:#8b5cf62a;color:var(--act)}
.runs span:first-child{width:16px;color:var(--mu)}.runs span:nth-child(2){flex:1;color:#cfcde0;font-weight:600}
.menu{display:grid;gap:8px;margin-top:14px}
.menu .btn.ghost{width:100%;justify-content:space-between;padding:12px 14px}
.menu .btn.ghost b{color:var(--act);font-weight:700}
.fine{color:var(--mu);font-size:11.5px;font-weight:500;margin:12px 0 0;line-height:1.4}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,5,12,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fin .2s}
#modal[hidden]{display:none}
#sheet{width:100%;max-width:560px;max-height:90dvh;background:linear-gradient(180deg,#1b1630,#111118);border:1px solid #a78bfa33;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:sup .35s cubic-bezier(.2,1,.3,1);overflow:hidden}
@media(min-width:620px){#modal{align-items:center}#sheet{border-radius:26px;max-height:86vh}}
@keyframes sup{from{transform:translateY(40px);opacity:0}}
#sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
#sheet header h2{margin:0;font-size:20px;font-weight:800;flex:1;letter-spacing:-.02em}
#sheet .x{width:34px;height:34px;border-radius:50%;background:#ffffff14;font-size:16px}
#sheet .body{overflow:auto;padding:4px 18px 22px;-webkit-user-select:text;user-select:text}
.panel{background:var(--glass);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:10px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel h3{margin:0 0 8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mu);font-weight:700}
.panel p{margin:0;color:#d6d4e4;font-size:13.5px;font-weight:500;line-height:1.5}
.panel ul{margin:0;padding-left:18px;color:#d6d4e4;font-size:13.5px;font-weight:500;line-height:1.5}
.panel li+li{margin-top:4px}
.side .panel{margin:0}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ladder div{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.2}
.ladder .chip{width:30px;height:30px}
.ladder small{display:block;color:var(--mu);font-size:11px;font-weight:600}
.ladder small.s{color:#fde68a}
/* reward rows */
.rw{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.rw:first-of-type{border-top:0}
.rw .chip{width:32px;height:32px}
.rw .t{flex:1;min-width:0}
.rw .t b{display:block;font-size:13.5px;font-weight:700}
.rw .t span{display:block;color:var(--mu);font-size:12px;font-weight:500}
.rw .pt{font-size:12.5px;font-weight:800;color:var(--act);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rw.got .pt{color:var(--ok)}
.rw .t span.req{color:var(--act);font-weight:700}
.side .rw .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* missions */
.ms{padding:9px 0;border-top:1px solid var(--ln)}
.ms:first-of-type{border-top:0}
.ms div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600}
.ms b{font-variant-numeric:tabular-nums;color:var(--mu);font-weight:700;font-size:12.5px;white-space:nowrap}
.ms em{display:block;height:6px;border-radius:3px;background:#ffffff12;overflow:hidden;margin-top:6px}
.ms i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .3s}
.ms.done div span{color:var(--ok)}.ms.done i{background:var(--ok)}.ms.done b{color:var(--ok)}
.mrw{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px;border-radius:12px;background:#06b6d414;border:1px dashed #06b6d455;font-size:12.5px;color:#cfeff6}
.mrw .chip{width:30px;height:30px}
.mrw.got{background:#34d39914;border-color:#34d39955;color:#c9f4e2}
/* wallet */
.cp{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 34%,#16161e),#16161e 70%);border:1px solid #ffffff22;border-radius:16px;padding:10px 12px;margin:8px 0;position:relative;overflow:hidden;cursor:pointer}
.cp::before,.cp::after{content:"";position:absolute;left:calc(100% - 78px);width:14px;height:14px;border-radius:50%;background:#111118}
.cp::before{top:-7px}.cp::after{bottom:-7px}
.cp.done{filter:grayscale(.9);opacity:.55}.cp.exp{opacity:.4}
.cp .t{flex:1;min-width:0}.cp .t b{display:block;font-size:15px}.cp .t span{display:block;color:#dcdbe8;font-size:12.5px;font-weight:500}
.cp .t small{color:var(--act);font-size:11.5px;font-weight:700}
.cp .qs{width:56px;height:56px;background:#fff;border-radius:8px;padding:4px;flex:none}
.cp .qs svg{width:100%;height:100%;display:block}
.cp.open{flex-wrap:wrap}.cp.open .t{flex:1 1 calc(100% - 60px)}.cp.open .qs{width:160px;height:160px;margin:8px auto 2px;order:5}
.cp.open::before,.cp.open::after{display:none}
.cp .fn{order:6;width:100%;text-align:center;color:var(--mu);font-size:11.5px;font-weight:500}
.rd{position:relative;order:7;width:100%;overflow:hidden;height:46px;border-radius:12px;background:#ffffff18;font-weight:800;display:grid;place-items:center;margin-top:6px;touch-action:none}
.rd i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#10b981,#34d399)}
.rd span{position:relative;font-size:13.5px}
.empty{text-align:center;color:var(--mu);padding:16px 8px;font-size:13px;font-weight:500}
.side .cp{padding:8px 10px;gap:10px}.side .cp .qs{display:none}.side .cp::before,.side .cp::after{display:none}
.side .cp .t b{font-size:13.5px}
.keys{color:var(--mu);font-size:12px;font-weight:500;text-align:center;margin:0}
@media(max-height:700px){.card h1{font-size:25px}.card p{margin:5px 0;font-size:13px}.rwrow{margin:10px 0}.big{font-size:40px}}
@media(max-height:600px){#chain{display:none}}
@media(max-width:420px){#shake span{display:none}#shake{padding:7px 8px}.hrow{gap:10px}}
/* street svg */
.sf .glass{fill:url(#gDark);transition:fill .9s}
.sf.on .glass{fill:url(#gLit)}
.sf .awn{fill:#262b45;transition:fill .9s}
.sf.on .awn{fill:var(--c)}
.sf .fas{fill:#141831;transition:fill .9s}
.sf.on .fas{fill:var(--c2)}
.sf .fn{fill:#ffffff38;font:800 17px var(--font);letter-spacing:2px;text-anchor:middle;transition:fill .9s}
.sf.on .fn{fill:#fff}
.sf .goods,.sf .spill{opacity:0;transition:opacity 1.1s}
.sf.on .goods,.sf.on .spill{opacity:1}
.sf .rent{transition:opacity .6s}.sf.on .rent{opacity:0}
.party{opacity:0;transition:opacity 1.4s}
.og *{animation:none!important;transition:none!important}
#street.lit .party{opacity:1}
</style>
</head>
<body>
<svg id="street" aria-hidden="true" preserveAspectRatio="xMidYMax slice"></svg>
<div id="app">
 <aside id="left" class="side">
  <section class="panel"><h3 data-i="rewards"></h3><div id="sideRw"></div></section>
 </aside>
 <main id="main">
  <header id="top">
   <div class="brand"><i class="logo"></i><div><b>Street Merge</b><span>by Vitrine</span></div></div>
   <button class="ib" id="bMis" data-a="missions"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span class="bd" id="misBd"></span></button>
   <button class="ib" id="bWal" data-a="wallet"><svg viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.5a2 2 0 0 0 0 3V15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.5a2 2 0 0 0 0-3z"/><path d="M14 7v10" stroke-dasharray="2 2.4"/></svg><span class="bd" id="walBd"></span></button>
   <button class="ib" id="bMenu" data-a="menu"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </header>
  <section id="hud">
   <div class="hrow">
    <div id="kim"></div>
    <div class="stat"><small data-i="score"></small><b id="score">0</b></div>
    <div class="stat b2"><small data-i="best"></small><b id="best">0</b></div>
    <div class="sp"></div>
    <button id="shake"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l-2 4 2 4M20 8l2 4-2 4M8 5l-1 14M16 5l1 14"/></svg><span data-i="shake"></span><b id="shN">1</b></button>

function substep(h){
 const B=S.balls;
 for(const b of B){b.vy+=G*h;b.x+=b.vx*h;b.y+=b.vy*h;b.a+=b.w*h;b.age+=h;b.vx*=1-.15*h;b.w*=1-1.2*h;if(b.sc<1)b.sc=Math.min(1,b.sc+h*4.5)}
 for(let it=0;it<3;it++){
  for(let i=0;i<B.length;i++){const a=B[i];
   for(let j=i+1;j<B.length;j++){const b=B[j];
    const dx=b.x-a.x,dy=b.y-a.y,mn=a.r+b.r;
    if(dx>mn||dx<-mn||dy>mn||dy<-mn)continue;
    const d2=dx*dx+dy*dy;if(d2>=mn*mn)continue;
    const d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d,pen=mn-d,ia=a.im,ib=b.im;
    if(a.t===b.t&&!a.dead&&!b.dead&&!S.attract)S.mq.push([a,b]);
    const s=pen/(ia+ib)*.85;a.x-=nx*s*ia;a.y-=ny*s*ia;b.x+=nx*s*ib;b.y+=ny*s*ib;
    const rvx=(b.vx+b.w*ny*b.r)-(a.vx-a.w*ny*a.r),rvy=(b.vy-b.w*nx*b.r)-(a.vy+a.w*nx*a.r);
    const vn=rvx*nx+rvy*ny;
    if(vn<0){const e=vn<-120?.12:0,j2=-(1+e)*vn/(ia+ib);
     a.vx-=j2*nx*ia;a.vy-=j2*ny*ia;b.vx+=j2*nx*ib;b.vy+=j2*ny*ib;
     if(vn<-160&&it===0)hitSnd(-vn);
     const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty;let jt=-vt/(3*(ia+ib));const mx=.35*j2;jt=clamp(jt,-mx,mx);
     a.vx-=jt*tx*ia;a.vy-=jt*ty*ia;b.vx+=jt*tx*ib;b.vy+=jt*ty*ib;
     a.w-=2*jt*ia/a.r;b.w-=2*jt*ib/b.r}
   }
  }
  for(const b of B){
   if(b.y+b.r>FLOOR){b.y=FLOOR-b.r;if(b.vy>0){const e=b.vy>200?.15:0;if(b.vy>160)hitSnd(b.vy);b.vy=-b.vy*e}
    const vt=b.vx-b.w*b.r,k=-vt/3*.6;b.vx+=k;b.w-=2*k/b.r}
   if(b.x-b.r<L){b.x=L+b.r;if(b.vx<0)b.vx=-b.vx*(b.vx<-200?.12:0);const vt=b.vy-b.w*b.r;b.vy+=-vt/3*.5;b.w-=2*(-vt/3*.5)/b.r}
   if(b.x+b.r>R){b.x=R-b.r;if(b.vx>0)b.vx=-b.vx*(b.vx>200?.12:0);const vt=b.vy+b.w*b.r;b.vy+=-vt/3*.5;b.w+=2*(-vt/3*.5)/b.r}
  }
 }
}

/* ================= sizing, input, loop ================= */
function fit(){
 const st=$('#stage'),bw=st.clientWidth,bh=st.clientHeight;if(!bw||!bh)return;

 cv.style.width=W*VS+'px';cv.style.height=H*VS+'px';cv.width=Math.round(W*VS*DPR);cv.height=Math.round(H*VS*DPR);
 requestAnimationFrame(()=>{const ot=cv.offsetTop,ol=cv.offsetLeft;$('#says').style.top=(ot+78*VS)+'px';$('#toasts').style.top=(ot+190*VS)+'px';
  ['#title','#over','#pause'].forEach(s=>{const o=$(s);o.style.inset='auto';o.style.left=ol+'px';o.style.top=ot+'px';o.style.width=W*VS+'px';o.style.height=H*VS+'px'})});
}
function pointerX(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
let pDown=false;
cv.addEventListener('pointerdown',e=>{resumeAudio();if(S.state!=='play'||S.paused)return;pDown=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}S.aimX=pointerX(e)});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||pDown)S.aimX=pointerX(e)});
cv.addEventListener('pointerup',e=>{if(!pDown)return;pDown=false;S.aimX=pointerX(e);drop()});
cv.addEventListener('pointercancel',()=>{pDown=false});
const keys={};
addEventListener('keydown',e=>{resumeAudio();
 if(e.code==='Escape'){if(!$('#modal').hidden)ui.closeModal();else if(S.state==='play')setPause(!S.paused);return}
 if(!$('#modal').hidden)return;
 if(e.code==='Space'||e.code==='ArrowDown'||e.code==='Enter'){e.preventDefault();if(S.state==='play'){if(S.paused)setPause(false);else drop()}else startGame()}
 if(e.code==='ArrowLeft'||e.code==='ArrowRight'){keys[e.code]=1;e.preventDefault()}
 if(e.code==='KeyS')shake();if(e.code==='KeyM')ui.toggleSound();if(e.code==='KeyP')setPause(!S.paused)});
addEventListener('keyup',e=>{delete keys[e.code]});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.state==='play'&&!S.paused)setPause(true)});
let last=0;
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;let dt=(ts-last)/1000;last=ts;if(dt>.05)dt=.05;if(document.hidden)return;
 if(!$('#modal').hidden||S.paused){render();return}
 if(keys.ArrowLeft)S.aimX-=380*dt;if(keys.ArrowRight)S.aimX+=380*dt;S.aimX=clamp(S.aimX,L,R);

 banner(tr('couponB'));
 setTimeout(()=>{SFX.coupon();buzz([20,30,20])},200);
 toast(mChip(m,'sp'),`<b>${esc(tr('unlocked'))} · ${esc(mName(m))}</b><small>${esc(mOffer(m))} · ${esc(tr('valid'))}</small>`,4000,'gold');
 ui.wallet();ui.rewards();
}
const wonToday=m=>getCoupons().some(c=>c.m===m&&dayKey(new Date(c.issued))===dayKey());
let openId=null;
function cpHTML(c){
 const st=cState(c),left=c.exp-Date.now(),h=Math.floor(left/HOUR),mn=Math.floor(left%HOUR/60000),M=MER[c.m];
 const meta=st==='redeemed'?tr('redeemedL'):st==='expired'?tr('expiredL'):tr('validFor',h,String(mn).padStart(2,'0'),c.id);
 const open=openId===c.id&&st==='active';
 return `<div class="cp ${st==='redeemed'?'done':st==='expired'?'exp':''} ${open?'open':''}" data-id="${c.id}" style="--c:${M.c}">${mChip(c.m,'sp')}<div class="t"><b>${esc(mName(c.m))}</b><span>${esc(mOffer(c.m))}</span><small>${meta}</small></div>${st==='active'?`<div class="qs">${qrSvg('VITRINE|'+c.id+'|'+c.m+'|'+c.exp)}</div>`:''}${open?`<div class="fn">${esc(mFine(c.m))}</div><div class="rd" data-id="${c.id}"><i></i><span>${esc(tr('staffHold'))}</span></div>`:''}</div>`}
function renderWallet(el,side){
 let cs=getCoupons();if(side)cs=cs.filter(c=>cState(c)==='active').slice(0,4);
 el.innerHTML=cs.length?cs.map(cpHTML).join(''):`<div class="empty">${tr('walletEmpty')}</div>`;
}
function wireWallet(el,side){
 el.onclick=e=>{const cp=e.target.closest('.cp');if(!cp||e.target.closest('.rd'))return;if(side){openWallet(cp.dataset.id);return}const id=cp.dataset.id;openId=openId===id?null:id;SFX.click();ui.wallet()};
 el.onpointerdown=e=>{const rd=e.target.closest('.rd');if(!rd)return;const i=rd.querySelector('i');i.style.transition='width .9s linear';i.style.width='100%';
  rd._t=setTimeout(()=>redeem(rd.dataset.id),900);
  const stop=()=>{clearTimeout(rd._t);i.style.transition='width .2s';i.style.width='0';rd.removeEventListener('pointerup',stop);rd.removeEventListener('pointerleave',stop)};
  rd.addEventListener('pointerup',stop);rd.addEventListener('pointerleave',stop)};
}
function redeem(id){const cs=getCoupons(),c=cs.find(x=>x.id===id);if(!c||c.state==='redeemed')return;c.state='redeemed';c.at=Date.now();ls.set('coupons',cs);openId=null;resumeAudio();SFX.win();buzz([30,40,30]);ui.wallet();toast(mChip(c.m,'sp'),`<b>${esc(tr('redeemedAt',mName(c.m)))}</b><small>${esc(tr('redeemedS'))}</small>`,3000,'ok')}

/* ================= daily missions ================= */
function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
const missions=(()=>{
 const POOL=[r=>({k:'tier',n:[6,7,8][Math.floor(r()*3)]}),r=>({k:'chain',n:r()<.6?4:5}),r=>({k:'score',n:[2000,2500,3000][Math.floor(r()*3)]}),r=>({k:'merges',n:r()<.5?100:150}),r=>({k:'noshake',n:r()<.5?6:7}),r=>({k:'plays',n:3}),r=>({k:'total',n:r()<.5?5000:8000})];
 function fresh(){const d=dayKey(),r=seeded('vitrine'+d),idx=[];while(idx.length<3){const i=Math.floor(r()*POOL.length);if(!idx.includes(i))idx.push(i)}
  return{d,m:idx.map(i=>POOL[i](r)),p:[0,0,0],done:[false,false,false],plays:0,total:0,claimed:false}}
 function get(){let d=ls.get('day',null);if(!d||d.d!==dayKey()){d=fresh();ls.set('day',d)}return d}
 const live=()=>S.state==='play'||S.state==='over';
 function value(d,m){switch(m.k){
  case 'tier':return live()&&S.maxTier>=m.n?1:0;
  case 'noshake':return live()&&S.maxTier>=m.n&&S.shakesUsed===0?1:0;
  case 'chain':return live()?S.bestCombo:0;
  case 'score':return live()?S.score:0;
  case 'merges':return live()?S.merges:0;
  case 'plays':return d.plays;
  case 'total':return d.total+(S.state==='play'?S.score:0)}}
 const target=m=>(m.k==='tier'||m.k==='noshake')?1:m.n;
 function text(m){const f=STR[LANG].m[m.k];return f(m.k==='tier'||m.k==='noshake'?tierName(m.n):m.k==='plays'||m.k==='chain'||m.k==='merges'?m.n:fmt(m.n))}
 function update(){if(S.attract)return;const d=get();let ch=false;
  d.m.forEach((m,i)=>{if(d.done[i])return;const v=value(d,m);if(v>d.p[i]){d.p[i]=v;ch=true}if(d.p[i]>=target(m)){d.done[i]=true;ch=true;
   setTimeout(()=>{SFX.unlock();toast('<div class="chip" style="--c:#34d399;--c2:#047857;color:#fff;font-weight:900">✓</div>',`<b>${esc(tr('mDone'))}</b><small>${esc(text(m))}</small>`,2600,'ok')},300)}});
  if(ch){if(d.done.every(Boolean)&&!d.claimed){d.claimed=true;ls.set('day',d);setTimeout(()=>{toast(mChip('moa','sp'),`<b>${esc(tr('mAllDone'))}</b><small>${esc(mName('moa'))}</small>`,2600,'ok');earn('moa')},900)}
   ls.set('day',d);ui.missions()}}
 function onStart(){const d=get();d.plays++;ls.set('day',d);update()}
 function onEnd(){const d=get();d.total+=S.score;ls.set('day',d);update()}
 function html(){const d=get();
  const rows=d.m.map((m,i)=>{const tg=target(m),v=Math.min(tg,d.p[i]),done=d.done[i],pct=Math.round(v/tg*100),lab=done?'✓':(tg===1?'0 / 1':fmt(v)+' / '+fmt(tg));
   return `<div class="ms ${done?'done':''}"><div><span>${esc(text(m))}</span><b>${lab}</b></div><em><i style="width:${done?100:pct}%"></i></em></div>`}).join('');
  const end=new Date();end.setHours(24,0,0,0);const left=end-Date.now(),hh=Math.floor(left/HOUR),mm=Math.floor(left%HOUR/60000);
  return rows+`<div class="mrw ${d.claimed?'got':''}">${mChip('moa','sp')}<div><b>${esc(d.claimed?tr('mAllDone'):tr('mAll'))}</b><br>${esc(mName('moa'))} · ${esc(mOffer('moa'))}</div></div><p class="fine" style="text-align:center">${esc(tr('mReset',hh+'h '+String(mm).padStart(2,'0')+'m'))}</p>`}
 const count=()=>get().done.filter(Boolean).length;
 return{update,onStart,onEnd,html,count,get};
})();

/* ================= modal ================= */
const modal=$('#modal'),sheet=$('#sheet');
function openModal(title,render,key){
 if(S.state==='play'&&!S.paused)setPause(true);
 sheet.innerHTML=`<header><h2>${title}</h2><button class="x" aria-label="${esc(tr('close'))}">✕</button></header><div class="body"></div>`;
 modal.hidden=false;sheet.dataset.k=key||'';sheet.querySelector('.x').onclick=ui.closeModal;render(sheet.querySelector('.body'));
}
modal.addEventListener('pointerdown',e=>{if(e.target===modal)ui.closeModal()});
function openWallet(id){openId=id||null;openModal(esc(tr('wallet')),b=>{b.innerHTML=`<div id="wlist"></div><p class="fine">${esc(tr('walletNote'))}</p><p class="fine">${esc(tr('demo'))}</p>`;const w=b.querySelector('#wlist');renderWallet(w);wireWallet(w)},'wallet')}
function openMissions(){openModal(esc(tr('missions')),b=>{b.innerHTML=`<div class="panel" id="mlist">${missions.html()}</div>`},'missions')}
function rewardsHTML(){
 const rows=REWARDS.map(r=>{const got=wonToday(r.m);return `<div class="rw ${got?'got':''}">${mChip(r.m,'sp')}<div class="t"><b>${esc(mName(r.m))}</b><span>${esc(mOffer(r.m))}</span></div><div class="pt">${got?'✓ '+esc(tr('today')):fmt(r.at)}</div></div>`}).join('');
 const pass=wonToday('pass'),moa=wonToday('moa');
 return rows+`<div class="rw ${pass?'got':''}">${mChip('pass','sp')}<div class="t"><b>${esc(mName('pass'))}</b><span>${esc(mOffer('pass'))}</span><span class="req">${esc(tr('rwPass'))}</span></div><div class="pt">${pass?'✓':'★'}</div></div>
 <div class="rw ${moa?'got':''}">${mChip('moa','sp')}<div class="t"><b>${esc(mName('moa'))}</b><span>${esc(mOffer('moa'))}</span><span class="req">${esc(tr('rwMis'))}</span></div><div class="pt">${moa?'✓':'◎'}</div></div>`}
function openHow(section){openModal(esc(tr('how')),b=>{
 b.innerHTML=`<div class="panel"><h3>${esc(tr('hGoal'))}</h3><p>${esc(tr('pGoal'))}</p></div>
 <div class="panel"><h3>${esc(tr('hPlay'))}</h3><ul>${tr('lPlay').map(x=>'<li>'+x+'</li>').join('')}</ul></div>
 <div class="panel"><h3>${esc(tr('hOver'))}</h3><p>${esc(tr('pOver'))}</p></div>
 <div class="panel"><h3>${esc(tr('hShops'))}</h3><div class="ladder">${TIERS.map((T,t)=>`<div>${chipHTML(t,T.s?'sp':'')}<span>${esc(tierName(t))}${T.s?`<small class="s">${esc(mName(T.s))}</small>`:''}<small>${t?fmt(PTS[t-1])+' '+esc(tr('perMerge')):''}</small></span></div>`).join('')}</div></div>
 <div class="panel" id="rwSec"><h3>${esc(tr('hRw'))}</h3><p style="margin-bottom:6px">${esc(tr('pRw'))}</p>${rewardsHTML()}</div>
 <div class="panel"><h3>${esc(tr('hCp'))}</h3><p>${esc(tr('walletNote'))}</p></div>
 <p class="keys">${esc(tr('keys'))}</p><p class="fine" style="text-align:center">${esc(tr('demo'))}</p>`;
 if(section==='rw')requestAnimationFrame(()=>b.querySelector('#rwSec').scrollIntoView({block:'start'}));
},'how')}

/* ================= share ================= */
function shareScore(){
 const url=location.href.split('#')[0];const text=tr('shareT',tierName(S.maxTier),fmt(S.score));
 if(navigator.share){navigator.share({title:'Street Merge · Vitrine',text,url}).catch(()=>{});return}
 const fb=()=>toast('',`<b>${esc(text)}</b><small>${esc(url)}</small>`,4500);
 try{navigator.clipboard.writeText(text+' '+url).then(()=>toast('',`<b>${esc(tr('copied'))}</b><small>${esc(tr('copiedS'))}</small>`,2200),fb)}catch(e){fb()}
}

/* ================= UI ================= */
const ui={
 score(){$('#score').textContent=fmt(S.score);$('#best').textContent=fmt(S.best)},
 next(){const c=$('#nextc');c.style.setProperty('--c',TIERS[S.nextT].c);c.style.setProperty('--c2',TIERS[S.nextT].c2);c.querySelector('img').src=glyphURL[S.nextT]},
 shakes(){$('#shN').textContent=S.shakes;$('#shake').disabled=S.shakes<1||S.state!=='play'},
 reset(){ui.score();ui.chain();ui.shakes();ui.wallet();ui.goal();ui.missions();ui.rewards();paintKim()},
 unlock(t){ui.chain(t);paintKim()},
 chain(pop){$('#chain').innerHTML=TIERS.map((T,t)=>chipHTML(t,(S.state!=='title'&&S.maxTier>=t?'':'lock')+(T.s?' sp':'')+(pop===t?' pop':''))).join('')},
 goal(){
  const g=$('#goal'),i=S.state==='title'?0:S.rIdx;let chip,txt,val,pct;
  if(i<REWARDS.length){const r=REWARDS[i],prev=i?REWARDS[i-1].at:0,sc=S.state==='title'?0:S.score;chip=mChip(r.m);txt=tr('goalC',mName(r.m));val=fmt(sc)+' / '+fmt(r.at);pct=clamp((sc-prev)/(r.at-prev),0,1)}
  else if(!S.won.includes('pass')){chip=mChip('pass');txt=tr('goalPass');val=(S.maxTier+1)+' / '+NT;pct=(S.maxTier)/(NT-1)}
  else{chip=mChip('pass');txt=tr('goalDone');val=fmt(S.score);pct=1}
  g.classList.toggle('won',i>=REWARDS.length);$('#goalChip').innerHTML=chip;$('#goalTxt').textContent=txt;$('#goalVal').textContent=val;$('#goalBar').style.width=(pct*100).toFixed(1)+'%';
 },
 wallet(){const n=getCoupons().filter(c=>cState(c)==='active').length;$('#walBd').textContent=n||'';
  const sw=$('#sideWal');renderWallet(sw,true);wireWallet(sw,true);const wl=$('#wlist');if(wl&&!modal.hidden&&sheet.dataset.k==='wallet'){renderWallet(wl);wireWallet(wl)}},
 missions(){const n=missions.count(),b=$('#misBd');b.textContent=n+'/3';b.classList.toggle('ok',n===3);$('#sideMis').innerHTML=missions.html();const ml=$('#mlist');if(ml&&!modal.hidden&&sheet.dataset.k==='missions')ml.innerHTML=missions.html()},
 rewards(){$('#sideRw').innerHTML=rewardsHTML()},
 title(){
  const ov=$('#title');ov.hidden=false;
  ov.innerHTML=`<div class="card"><span class="tag off">${esc(winLabel())}</span><h1>${tr('titleH')}</h1><p>${esc(tr('titleP'))}</p>
  <div class="rwrow">${REWARDS.map(r=>`<div class="${wonToday(r.m)?'got':''}">${mChip(r.m,'sp')}${wonToday(r.m)?'✓':fmt(r.at)}</div>`).join('')}</div>
  <button class="btn" id="bPlay">${esc(tr('play'))}</button>
  <div class="row"><button class="btn ghost" id="tHow">${esc(tr('how'))}</button><button class="btn ghost" id="tMis">${esc(tr('misShort'))} · ${missions.count()}/3</button></div></div>`;
  $('#bPlay').onclick=()=>{resumeAudio();SFX.click();startGame()};$('#tHow').onclick=()=>openHow();$('#tMis').onclick=openMissions;
 },
 over(){
  const me=S.score,full=S.maxTier>=NT-1,nr=REWARDS.find(r=>r.at>me);
  const runs=ls.get('runs',[]);let marked=false;
  const ov=$('#over');ov.hidden=false;
  ov.innerHTML=`<div class="card"><span class="tag ${full?'':'off'}">${esc(full?tr('lit'):tr('room'))}</span><div class="big">${fmt(me)}</div>
  <p style="margin:4px 0 0;color:var(--act);font-weight:700">${esc(S.newBest?tr('newBest'):tr('bestIs',fmt(S.best)))}</p>
  <div class="row" style="align-items:center;margin:10px 0 2px;gap:10px">${chipHTML(S.maxTier,TIERS[S.maxTier].s?'sp':'')}<span style="text-align:left;font-size:13px;color:var(--mu)">${esc(tr('reached'))}<br><b style="color:var(--tx);font-size:15px">${esc(tierName(S.maxTier))}</b></span></div>
  ${S.won.length?`<div class="won">${S.won.map(m=>`<span>${mChip(m)}${esc(mName(m))}</span>`).join('')}</div>`:''}
  ${nr?`<p class="hint">${tr('toNext',fmt(nr.at-me),esc(mName(nr.m)))}</p>`:''}
  ${runs.length>1?`<div class="runs"><h4>${esc(tr('runs'))}</h4>${runs.slice(0,3).map((x,i)=>{const isMe=!marked&&x.s===me&&x.d===dayKey();if(isMe)marked=true;return `<div class="${isMe?'me':''}"><span>${i+1}</span><span>${esc(tierName(x.t))}</span><b>${fmt(x.s)}</b></div>`}).join('')}</div>`:''}
  <button class="btn" id="again" style="margin-top:12px">${esc(tr('again'))}</button>
  <div class="row"><button class="btn ghost" id="oShare">${esc(tr('share'))}</button><button class="btn ghost" id="oWal">${esc(tr('walletB'))}</button></div></div>`;
  $('#again').onclick=()=>{SFX.click();startGame()};$('#oShare').onclick=shareScore;$('#oWal').onclick=()=>openWallet();
  ui.shakes();
 },
 pause(){
  const ov=$('#pause'),inGame=S.state==='play';ov.hidden=false;
  ov.innerHTML=`<div class="card"><h1 style="font-size:24px">${esc(inGame?tr('paused'):tr('menu'))}</h1><div class="menu">
  ${inGame?`<button class="btn" id="pResume">${esc(tr('resume'))}</button>`:''}
  ${inGame?`<button class="btn ghost" id="pRestart"><span>${esc(tr('restart'))}</span></button>`:''}
  <button class="btn ghost" id="pHow"><span>${esc(tr('how'))}</span><b>?</b></button>
  <button class="btn ghost" id="pSnd"><span>${esc(tr('sound'))}</span><b>${esc(muted?tr('off'):tr('on'))}</b></button>
  <button class="btn ghost" id="pLang"><span>${esc(tr('lang'))}</span><b>${LANG==='ko'?'한국어':'English'}</b></button>
  ${inGame?'':`<button class="btn" id="pClose">${esc(tr('close'))}</button>`}</div><p class="fine">${esc(tr('demo'))}</p></div>`;
  const c=id=>ov.querySelector(id);
  if(c('#pResume'))c('#pResume').onclick=()=>setPause(false);
  if(c('#pRestart'))c('#pRestart').onclick=()=>{S.state='over';$('#pause').hidden=true;S.paused=false;startGame()};
  if(c('#pClose'))c('#pClose').onclick=()=>{ov.hidden=true};
  c('#pHow').onclick=()=>openHow();
  c('#pSnd').onclick=()=>{ui.toggleSound();ui.pause()};
  c('#pLang').onclick=()=>{setLang(LANG==='ko'?'en':'ko');ui.pause()};
 },
 toggleSound(){muted=!muted;ls.set('mute',muted);if(!muted){resumeAudio();SFX.click()}},
 closeModal(){modal.hidden=true;sheet.dataset.k='';openId=null}
};
function setLang(l){LANG=l;ls.set('lang',l);document.documentElement.lang=l;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
 const lab={missions:tr('missions'),wallet:tr('wallet'),menu:tr('menu')};document.querySelectorAll('[data-a]').forEach(b=>b.setAttribute('aria-label',lab[b.dataset.a]));
 street.update();ui.goal();ui.missions();ui.rewards();ui.wallet();
 if(!$('#title').hidden)ui.title();if(!$('#over').hidden)ui.over();
}

/* ================= boot ================= */
$('#bWal').onclick=()=>{resumeAudio();SFX.click();openWallet()};
$('#bMis').onclick=()=>{resumeAudio();SFX.click();openMissions()};
$('#bMenu').onclick=()=>{resumeAudio();SFX.click();if(S.state==='play')setPause(true);else ui.pause()};
$('#goal').onclick=()=>{resumeAudio();openHow('rw')};
$('#shake').onclick=shake;
window.__sim={startGame,update,drop,shake,S};
if(QP.has('og'))document.documentElement.classList.add('og');
const fontsReady=Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]);
Promise.all([loadGlyphs(),fontsReady]).then(()=>{
 S.nextT=0;S.best=ls.get('best',0);
 street.build();setLang(LANG);fit();ui.score();ui.chain();ui.next();ui.shakes();paintKim();
 ui.title();requestAnimationFrame(loop);
 new ResizeObserver(fit).observe($('#stage'));
 setInterval(()=>{if(!document.hidden){ui.wallet();if(missions.get().d!==dayKey())ui.missions()}},30000);
});
</script>
